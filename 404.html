<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wrong address · Klemme15</title>
  <script>
    // GitHub Pages addresses are case-sensitive: /klemme15/ is not /Klemme15/. Send any spelling to the right page,
    // keeping the rest of the address (viewer.html, #download and so on). Other wrong addresses go to the main page.
    (function () {
      var path = location.pathname;
      var m = path.match(/^\/klemme15(\/.*)?$/i);
      var target = (m ? "/Klemme15" + (m[1] || "/") : "/Klemme15/") + location.search + location.hash;
      // Shown while the redirect happens, so nobody is left looking at an error.
      window.k15Target = target;
      setTimeout(function () { location.replace(target); }, 1200);
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121417; color: #e4e8ec;
           font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 560px; padding: 32px 20px; }
    .tag { display: inline-block; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
           color: #121417; background: #f2a93b; border-radius: 999px; padding: 4px 14px; }
    h1 { font-size: clamp(30px, 8vw, 44px); line-height: 1.15; margin: 18px 0 12px; }
    p { margin: 0 0 22px; color: #b9c2cb; }
    .right { font-family: ui-monospace, Consolas, monospace; font-size: 17px; color: #e4e8ec; background: #1f2329;
             border: 1px solid #2b3037; border-radius: 8px; padding: 8px 12px; display: inline-block; word-break: break-all; }
    .right b { color: #8ccbea; }
    a.go { display: block; margin: 26px auto 14px; max-width: 360px; background: #8ccbea; color: #0d1117; font-weight: 700;
           font-size: 20px; text-decoration: none; border-radius: 12px; padding: 16px 20px; }
    .small { font-size: 15px; color: #8f99a4; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Wrong address</span>
    <h1>Klemme15 is one letter away</h1>
    <p>The address needs a <b>capital K</b>. The right one is:</p>
    <span class="right">expos-ai.github.io/<b>K</b>lemme15</span>
    <a class="go" id="go" href="/Klemme15/">Go to Klemme15 →</a>
    <p class="small" id="note">Taking you there now…</p>
  </main>
  <script>
    if (window.k15Target) document.getElementById("go").href = window.k15Target;
    else document.getElementById("note").textContent = "Tap the button to continue.";
  </script>
</body>
</html>
